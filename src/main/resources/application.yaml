server:
  port: 8084
spring:
  application:
    name: meowKanban
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:./data/meowkanban.db
    hikari:
      maximum-pool-size: 1
      connection-test-query: SELECT 1
  sql:
    init:
      mode: never

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1

meow-kanban:
  resource:
    storage-dir: data/resources
  security:
    jwt:
      secret: ${MEOW_KANBAN_JWT_SECRET:meow-kanban-development-secret-key-change-before-production-20260620}
      expiration-days: 7
