<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MeowKanban 注册</title>
  <link rel="stylesheet" href="/prototype/styles.css" th:href="@{/prototype/styles.css}">
</head>
<body class="auth-page">
  <main class="auth-shell register-shell" aria-label="账号注册">
    <section class="auth-panel register-panel" aria-label="注册">
      <a class="brand auth-brand" href="/prototype/index.html" th:href="@{/prototype/index.html}" aria-label="返回 MeowKanban 看板">
        <span class="brand-mark">M</span>
        <span>
          <strong>MeowKanban</strong>
          <small>轻量项目看板</small>
        </span>
      </a>

      <div class="auth-copy">
        <p class="eyebrow">创建账号</p>
        <h1>三步完成注册</h1>
      </div>

      <div class="register-progress" aria-label="注册进度">
        <div class="progress-topline">
          <span id="progressLabel">步骤 1 / 3</span>
          <strong id="progressTitle">基础信息</strong>
        </div>
        <div class="progress-track" aria-hidden="true">
          <span id="progressFill"></span>
        </div>
        <ol class="progress-steps">
          <li class="active" data-step-dot="0">资料</li>
          <li data-step-dot="1">验证</li>
          <li data-step-dot="2">密码</li>
        </ol>
      </div>

      <div class="register-stage" data-direction="next">
        <form class="register-step active" data-step="0" aria-label="基础信息">
          <label class="auth-field">
            <span>用户名</span>
            <input type="text" name="username" autocomplete="username" placeholder="3-50 位，仅字母、数字、下划线或短横线">
          </label>
          <label class="auth-field">
            <span>昵称</span>
            <input type="text" name="nickname" autocomplete="name" placeholder="团队内显示名称">
          </label>
          <div class="register-actions single-action">
            <button class="button primary" type="button" data-next>下一步</button>
          </div>
        </form>

        <form class="register-step" data-step="1" aria-label="邮箱验证">
          <label class="auth-field">
            <span>邮箱</span>
            <input type="email" name="email" autocomplete="email" placeholder="name@example.com">
          </label>
          <label class="auth-field">
            <span>验证码</span>
            <span class="code-control">
              <input type="text" name="code" inputmode="numeric" maxlength="6" placeholder="6 位验证码">
              <button class="text-button" type="button">发送</button>
            </span>
          </label>
          <div class="register-actions">
            <button class="button secondary" type="button" data-prev>上一步</button>
            <button class="button primary" type="button" data-next>下一步</button>
          </div>
        </form>

        <form class="register-step" data-step="2" aria-label="设置密码">
          <label class="auth-field">
            <span>密码</span>
            <span class="password-control">
              <input id="registerPassword" type="password" name="password" autocomplete="new-password" placeholder="至少 6 位">
              <button class="text-button" type="button" data-password-toggle="registerPassword">显示</button>
            </span>
          </label>
          <label class="auth-field">
            <span>再次输入密码</span>
            <span class="password-control">
              <input id="confirmPassword" type="password" name="confirmPassword" autocomplete="new-password" placeholder="再次输入密码">
              <button class="text-button" type="button" data-password-toggle="confirmPassword">显示</button>
            </span>
          </label>
          <p class="form-message" id="passwordMessage" aria-live="polite"></p>
          <div class="register-actions">
            <button class="button secondary" type="button" data-prev>上一步</button>
            <button class="button primary" type="button" id="finishRegister">完成注册</button>
          </div>
        </form>
      </div>

      <div class="auth-switch">
        <span>已有账号？</span>
        <a class="link-button" href="/login" th:href="@{/login}">返回登录</a>
      </div>
    </section>
  </main>

  <script src="/prototype/register.js" th:src="@{/prototype/register.js}"></script>
</body>
</html>
