<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MeowKanban 个人详情</title>
  <link rel="stylesheet" href="/prototype/styles.css" th:href="@{/prototype/styles.css}">
</head>
<body>
  <header class="app-header boards-header">
    <div class="header-left">
      <a class="header-brand" href="/boards" th:href="@{/boards}" aria-label="MeowKanban 看板列表">
        <span class="brand-mark small">M</span>
        <span>
          <strong>MeowKanban</strong>
          <small>轻量项目看板</small>
        </span>
      </a>
    </div>
    <div class="top-actions header-actions">
      <a class="button secondary boards-link-button" href="/boards" th:href="@{/boards}">看板列表</a>
      <div class="user-menu" aria-label="个人菜单">
        <a class="user-trigger" href="/profile" th:href="@{/profile}" aria-label="个人详情">
          <span class="avatar rose" data-current-user-avatar>我</span>
        </a>
      </div>
    </div>
  </header>

  <main class="profile-page" id="profileApp" v-cloak th:data-user-id="${userId}" th:data-current-user-id="${currentUserId}">
    <aside class="profile-sidebar" aria-label="个人基本信息">
      <div class="profile-identity">
        <button
          class="profile-avatar profile-avatar-button rose"
          :class="{ editable: canEditAvatar }"
          type="button"
          :disabled="!canEditAvatar || avatarUploading"
          :aria-label="canEditAvatar ? '修改头像' : '用户头像'"
          @click="openAvatarPicker"
        >
          <img v-if="user.avatarUrl" class="profile-avatar-image" :src="user.avatarUrl" alt="">
          <span v-else class="profile-avatar-text" v-text="profileLoading ? '' : user.initial"></span>
          <span v-if="canEditAvatar" class="profile-avatar-overlay" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M8.5 7 10 5h4l1.5 2H18a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h2.5Z"></path>
              <circle cx="12" cy="13" r="3.2"></circle>
            </svg>
          </span>
        </button>
        <input ref="avatarInput" class="profile-avatar-input" type="file" accept="image/*" @change="handleAvatarChange">
        <div>
          <p class="eyebrow">个人详情</p>
          <h1 v-text="profileLoading ? '加载中' : user.name"></h1>
        </div>
      </div>

      <dl class="profile-fields">
        <div v-for="field in profileFields" :key="field.label">
          <dt v-text="field.label"></dt>
          <dd v-text="profileLoading ? '-' : field.value"></dd>
        </div>
      </dl>

      <div class="profile-stats" aria-label="个人统计">
        <div v-for="stat in stats" :key="stat.label">
          <span v-text="stat.label"></span>
          <strong v-text="stat.value"></strong>
        </div>
      </div>

      <p class="form-message error" v-if="profileError" v-text="profileError"></p>

      <div class="profile-actions">
        <button class="button primary" type="button" @click="openProfileDialog">编辑资料</button>
        <button class="button secondary" type="button" @click="openSettingsDialog">账号设置</button>
      </div>
    </aside>

    <section class="profile-content" aria-label="个人工作内容">
      <section class="profile-section" aria-label="我的看板">
        <div class="profile-section-header">
          <div>
            <p class="eyebrow">我的看板</p>
            <h2>近期参与</h2>
          </div>
          <a class="button secondary boards-link-button" href="/boards" th:href="@{/boards}">全部看板</a>
        </div>

        <div class="profile-board-list">
          <template v-if="boardsLoading">
            <article v-for="item in 3" :key="item" class="profile-board-row board-row-skeleton" aria-hidden="true">
              <div class="board-row-main">
                <div class="board-icon skeleton-block"></div>
                <div class="board-copy">
                  <div class="board-title-line">
                    <span class="skeleton-line title"></span>
                    <span class="skeleton-pill"></span>
                    <span class="skeleton-pill"></span>
                  </div>
                  <span class="skeleton-line"></span>
                </div>
              </div>
              <div class="profile-board-meta">
                <span class="skeleton-line short"></span>
                <span class="skeleton-button"></span>
              </div>
            </article>
          </template>
          <template v-else>
            <article class="profile-board-row" v-for="board in boards" :key="board.id">
              <div class="board-row-main">
                <div class="board-icon" :class="[{ 'has-cover': board.coverUrl }, board.accent]">
                  <img v-if="board.coverUrl" :src="board.coverUrl" alt="">
                  <span v-else v-text="board.shortName"></span>
                </div>
                <div class="board-copy">
                  <div class="board-title-line">
                    <h3 v-text="board.name"></h3>
                    <span class="badge" :class="board.statusClass" v-text="board.status"></span>
                    <span class="badge" :class="roleClass(board.role)" v-text="roleLabel(board.role)"></span>
                  </div>
                  <p v-text="board.description"></p>
                </div>
              </div>
              <div class="profile-board-meta">
                <span v-text="board.updatedAt"></span>
                <a class="button primary boards-open-button" :href="board.href">打开</a>
              </div>
            </article>
          </template>
          <div class="board-empty" v-if="!boardsLoading && !boardsError && boards.length === 0">
            <strong>暂无看板</strong>
            <span>该用户最近还没有参与看板。</span>
          </div>
          <div class="board-load-state" v-if="boardsError">
            <span v-text="boardsError"></span>
            <button class="button secondary" type="button" @click="loadBoards">重试</button>
          </div>
        </div>
      </section>

      <section class="profile-section" aria-label="操作记录">
        <div class="profile-section-header">
          <div>
            <p class="eyebrow">操作记录</p>
            <h2>最近动态</h2>
          </div>
          <div class="segmented-control profile-activity-filter" aria-label="操作类型筛选">
            <button
              v-for="item in activityFilters"
              :key="item.value"
              class="segment"
              :class="{ active: activityFilter === item.value }"
              type="button"
              @click="activityFilter = item.value"
              v-text="item.label"
            ></button>
          </div>
        </div>

        <ol class="activity-list">
          <template v-if="activitiesLoading">
            <li v-for="item in 5" :key="item" class="activity-skeleton" aria-hidden="true">
              <span class="activity-marker"></span>
              <div>
                <div class="activity-line">
                  <span class="skeleton-line title"></span>
                  <span class="skeleton-line short"></span>
                </div>
                <span class="skeleton-line"></span>
              </div>
            </li>
          </template>
          <template v-else>
            <li v-for="activity in filteredActivities" :key="activity.id">
              <span class="activity-marker" :class="activity.type"></span>
              <div>
                <div class="activity-line">
                  <strong v-text="activity.action"></strong>
                  <span v-text="activity.time"></span>
                </div>
                <p v-text="activity.detail"></p>
              </div>
            </li>
          </template>
        </ol>
        <div class="board-empty" v-if="!activitiesLoading && !activitiesError && filteredActivities.length === 0">
          <strong>暂无操作记录</strong>
          <span>该用户最近还没有可展示的操作记录。</span>
        </div>
        <div class="board-load-state" v-if="activitiesError">
          <span v-text="activitiesError"></span>
          <button class="button secondary" type="button" @click="loadActivities">重试</button>
        </div>
      </section>
    </section>

    <div
      v-if="activeDialog"
      class="profile-modal-backdrop"
      role="presentation"
      @click.self="closeDialog"
    >
      <section
        class="profile-modal"
        role="dialog"
        aria-modal="true"
        :aria-labelledby="activeDialog === 'profile' ? 'profileDialogTitle' : 'settingsDialogTitle'"
      >
        <div class="profile-modal-header">
          <div>
            <p class="eyebrow" v-text="activeDialog === 'profile' ? '个人资料' : '账号设置'"></p>
            <h2 :id="activeDialog === 'profile' ? 'profileDialogTitle' : 'settingsDialogTitle'" v-text="activeDialog === 'profile' ? '编辑资料' : '账号设置'"></h2>
          </div>
          <button class="profile-modal-close" type="button" aria-label="关闭弹窗" @click="closeDialog">×</button>
        </div>

        <form v-if="activeDialog === 'profile'" class="profile-form" @submit.prevent="saveProfile">
          <label>
            <span>昵称</span>
            <input v-model.trim="profileForm.name" type="text" autocomplete="name">
          </label>
          <label>
            <span>性别</span>
            <select v-model.number="profileForm.gender">
              <option :value="-1">未知</option>
              <option :value="1">男</option>
              <option :value="0">女</option>
            </select>
          </label>
          <label>
            <span>生日</span>
            <input v-model="profileForm.birthday" type="date">
          </label>
          <div class="profile-form-actions">
            <button class="button secondary" type="button" @click="closeDialog">取消</button>
            <button class="button primary" type="submit">保存资料</button>
          </div>
        </form>

        <form v-else class="profile-form" @submit.prevent="saveSettings">
          <label>
            <span>当前密码</span>
            <input v-model="settingsForm.currentPassword" type="password" autocomplete="current-password">
          </label>
          <label>
            <span>新密码</span>
            <input v-model="settingsForm.newPassword" type="password" autocomplete="new-password">
          </label>
          <label>
            <span>通知偏好</span>
            <select v-model="settingsForm.notification">
              <option value="all">全部通知</option>
              <option value="important">仅重要通知</option>
              <option value="none">不接收通知</option>
            </select>
          </label>
          <label class="profile-check">
            <input v-model="settingsForm.weeklyDigest" type="checkbox">
            <span>接收每周看板摘要</span>
          </label>
          <div class="profile-form-actions">
            <button class="button secondary" type="button" @click="closeDialog">取消</button>
            <button class="button primary" type="submit">保存设置</button>
          </div>
        </form>
      </section>
    </div>
  </main>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="/prototype/token.js" th:src="@{/prototype/token.js}"></script>
  <script src="/prototype/header-user.js" th:src="@{/prototype/header-user.js}"></script>
  <script src="/prototype/profile.js" th:src="@{/prototype/profile.js}"></script>
</body>
</html>
