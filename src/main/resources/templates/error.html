<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>请求异常 - MeowKanban</title>
  <link rel="stylesheet" href="/prototype/styles.css" th:href="@{/prototype/styles.css}">
</head>
<body>
  <main class="error-page">
    <section class="error-panel" aria-labelledby="errorTitle">
      <a class="header-brand error-brand" href="/boards" th:href="@{/boards}" aria-label="MeowKanban">
        <span class="brand-mark small">M</span>
        <span>
          <strong>MeowKanban</strong>
          <small>轻量项目看板</small>
        </span>
      </a>
      <p class="error-code" th:text="${status ?: 'ERROR'}">ERROR</p>
      <h1 id="errorTitle">请求处理失败</h1>
      <p class="error-desc" th:text="${message ?: '当前请求暂时无法完成，请稍后重试。'}">当前请求暂时无法完成，请稍后重试。</p>
      <div class="error-actions">
        <a class="button primary" href="/boards" th:href="@{/boards}">返回看板</a>
        <a class="button secondary" href="/login" th:href="@{/login}">重新登录</a>
      </div>
    </section>
  </main>
</body>
</html>
