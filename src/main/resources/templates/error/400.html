<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>400 请求错误 - MeowKanban</title>
  <link rel="stylesheet" href="/prototype/styles.css" th:href="@{/prototype/styles.css}">
</head>
<body>
  <main class="error-page">
    <section class="error-panel" aria-labelledby="errorTitle">
      <a class="header-brand error-brand" href="/boards" th:href="@{/boards}" aria-label="MeowKanban">
        <span class="brand-mark small">M</span>
        <span>
          <strong>MeowKanban</strong>
          <small>轻量项目看板</small>
        </span>
      </a>
      <p class="error-code">400</p>
      <h1 id="errorTitle">请求参数有误</h1>
      <p class="error-desc">当前请求无法被正确处理，请检查地址或提交内容后重试。</p>
      <div class="error-actions">
        <a class="button primary" href="/boards" th:href="@{/boards}">返回看板</a>
        <button class="button secondary" type="button" onclick="window.history.back()">返回上一页</button>
      </div>
    </section>
  </main>
</body>
</html>
